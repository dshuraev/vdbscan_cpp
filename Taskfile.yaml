version: 3

dotenv:
  - '.env'

vars:
  TOOLCHAIN:        '{{default "clang" .TOOLCHAIN}}'
  CXX:              '{{if eq .TOOLCHAIN "clang"}}clang++{{else}}g++{{end}}'
  CC:               '{{if eq .TOOLCHAIN "clang"}}clang{{else}}gcc{{end}}'
  GCOV_EXEC:        '{{if eq .TOOLCHAIN "clang"}}llvm-cov gcov{{else}}gcov{{end}}'
  OUT_DIR:          './build/{{.TOOLCHAIN}}'
  COV_DIR:          'build/{{.TOOLCHAIN}}-test-coverage'
  KITTI_STRIDE:     '{{default "1" .KITTI_STRIDE}}'
  KITTI_MAX_FILES:  '{{default "0" .KITTI_MAX_FILES}}'
  SYNTHETIC_DIR:    './.cache/synthetic-data'


tasks:
  # ── Library ────────────────────────────────────────────────────────────────

  build:lib:release:
    desc: Build the library (Release)
    cmds:
      - cmake -S . -B {{.OUT_DIR}} -G Ninja -DCMAKE_BUILD_TYPE=Release -DVDBSCAN_BUILD_CLI=OFF
      - cmake --build {{.OUT_DIR}} --target vdbscan -j

  # ── CLI ────────────────────────────────────────────────────────────────────

  build:cli:release:
    desc: Build the CLI + library (Release)
    cmds:
      - cmake -S . -B {{.OUT_DIR}} -G Ninja -DCMAKE_BUILD_TYPE=Release -DVDBSCAN_BUILD_CLI=ON
      - cmake --build {{.OUT_DIR}} --target vdbscan_cli -j

  # ── KITTI benchmark ────────────────────────────────────────────────────────
  # Usage: task build:bench:kitti:release KITTI_PATH=/data/kitti/velodyne

  perf:flamegraph:kitti:
    desc: >-
      Record perf trace over the KITTI benchmark and generate a flamegraph SVG.
      Requires KITTI_PATH=<path>. Optional: KITTI_STRIDE, KITTI_MAX_FILES.
      Requires flamegraph (from cargo-flamegraph) on PATH.
    requires:
      vars: [KITTI_PATH]
    vars:
      BENCH_FILTER:    '{{default "" .BENCH_FILTER}}'
      SVG:             build/{{.TOOLCHAIN}}-flamegraph-kitti.svg
    cmds:
      - >-
        cmake -S . -B {{.OUT_DIR}} -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DVDBSCAN_BUILD_CLI=OFF
        -DVDBSCAN_BENCHMARK_KITTI=ON
        -DKITTI_DATASET_PATH={{.KITTI_PATH}}
        -DMAX_FILES={{.KITTI_MAX_FILES}}
        -DSTRIDE={{.KITTI_STRIDE}}
      - cmake --build {{.OUT_DIR}} --target vdbscan_bench_kitti -j
      - defer: rm -f perf.data perf.data.old
      - >-
        flamegraph -o {{.SVG}}
        -- {{.OUT_DIR}}/benches/kitti/vdbscan_bench_kitti
        {{if .BENCH_FILTER}}--benchmark_filter={{.BENCH_FILTER}}{{end}}
        --benchmark_min_time=5s
      - echo "Flamegraph written to {{.SVG}}"

  bench:kitti:tracy:
    desc: >-
      Build and run the KITTI benchmark with Tracy instrumentation enabled.
      Requires KITTI_PATH=<path>. Optional: KITTI_STRIDE, KITTI_MAX_FILES.
      If both EPSILON and MINPTS are set, then it only runs the trace with these parameters.
      Start the Tracy profiler (tracy-profiler or tracy-capture) before running,
      then hit Connect.
    requires:
      vars: [KITTI_PATH]
    vars:
      TRACY_DIR: '{{.OUT_DIR}}/tracy'
    cmds:
      - >-
        cmake -S . -B {{.TRACY_DIR}} -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DVDBSCAN_BUILD_CLI=OFF
        -DVDBSCAN_BENCHMARK_KITTI=ON
        -DVDBSCAN_TRACY=ON
        -DKITTI_DATASET_PATH={{.KITTI_PATH}}
        -DMAX_FILES={{.KITTI_MAX_FILES}}
        -DSTRIDE={{.KITTI_STRIDE}}
        -DEPSILON={{.EPSILON}}
        -DMINPTS={{.MINPTS}}
      - cmake --build {{.TRACY_DIR}} --target vdbscan_bench_kitti -j
      - '{{.TRACY_DIR}}/benches/kitti/vdbscan_bench_kitti --benchmark_min_time=10s'

  build:bench:kitti:
    desc: |
      Build the KITTI benchmark (Release).
      Requires KITTI_PATH=<path>. Optional: KITTI_STRIDE, KITTI_MAX_FILES
    requires:
      vars: [KITTI_PATH]
    cmds:
      - >-
        cmake -S . -B {{.OUT_DIR}} -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DVDBSCAN_BUILD_CLI=OFF
        -DVDBSCAN_BENCHMARK_KITTI=ON
        -DKITTI_DATASET_PATH={{.KITTI_PATH}}
        -DMAX_FILES={{.KITTI_MAX_FILES}}
        -DSTRIDE={{.KITTI_STRIDE}}
      - cmake --build {{.OUT_DIR}} --target vdbscan_bench_kitti -j

  bench:kitti:run:
    desc: Run KITTI benchmark
    deps: [build:bench:kitti]
    cmds:
      - '{{.OUT_DIR}}/benches/kitti/vdbscan_bench_kitti'
  # ── Tests ──────────────────────────────────────────────────────────────────
  # TOOLCHAIN controls both the compiler and the gcov tool:
  #   clang  → clang++ / llvm-cov gcov   (default)
  #   gcc    → g++     / gcov

  test:unit:run:
    desc: Build and run unit tests (Debug, no coverage)
    cmds:
      - >-
        cmake -S . -B {{.OUT_DIR}}/test -G Ninja
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_CXX_COMPILER={{.CXX}}
        -DCMAKE_C_COMPILER={{.CC}}
        -DVDBSCAN_BUILD_CLI=OFF
        -DVDBSCAN_TEST=ON
      - cmake --build build/{{.TOOLCHAIN}}/test --target vdbscan_tests -j
      - cd build/{{.TOOLCHAIN}}/test && ctest --output-on-failure

  test:synthetic:run:
    desc: Generate synthetic data (if needed) then run integration tests against it
    deps: [gen:synthetic]
    cmds:
      - >-
        cmake -S . -B {{.OUT_DIR}}/synth-test -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DCMAKE_CXX_COMPILER={{.CXX}}
        -DCMAKE_C_COMPILER={{.CC}}
        -DVDBSCAN_BUILD_CLI=OFF
        -DVDBSCAN_TEST=ON
        -DVDBSCAN_TEST_SYNTHETIC=ON
        -DSYNTHETIC_DIR={{.SYNTHETIC_DIR}}
      - cmake --build {{.OUT_DIR}}/synth-test -j
      - cd build/{{.TOOLCHAIN}}/synth-test && ctest --output-on-failure -R "Synthetic PLY"

  test:all:run:
    desc: Build and run all tests — unit (Debug) and synthetic integration (Release)
    deps: [test:unit:run, test:synthetic:run]

  # Generates line and branch coverage HTML + text summary under
  # build/<toolchain>-test-coverage/coverage/.
  # Requires gcovr (pip install gcovr).
  # For TOOLCHAIN=clang, llvm-cov must be on PATH.

  test:coverage:
    desc: Build and run tests with line+branch coverage reports
    cmds:
      - >-
        cmake -S . -B {{.COV_DIR}} -G Ninja
        -DCMAKE_BUILD_TYPE=Debug
        -DCMAKE_CXX_COMPILER={{.CXX}}
        -DCMAKE_C_COMPILER={{.CC}}
        -DVDBSCAN_BUILD_CLI=OFF
        -DVDBSCAN_TEST=ON
        -DVDBSCAN_COVERAGE=ON
      - cmake --build {{.COV_DIR}} --target vdbscan_tests -j
      - cd {{.COV_DIR}} && ctest --output-on-failure
      - mkdir -p {{.COV_DIR}}/coverage
      - >-
        gcovr
        --root .
        --filter 'lib/'
        --gcov-executable '{{.GCOV_EXEC}}'
        --html-details {{.COV_DIR}}/coverage/index.html
        --txt {{.COV_DIR}}/coverage/summary.txt
        --txt-metric branch
        --print-summary
        {{.COV_DIR}}

  # ── Utilities ──────────────────────────────────────────────────────────────

  gen:synthetic:
    desc: Generate synthetic point cloud data
    internal: true
    vars:
      CONFIGS:
        sh: find ./scripts/config/synthetic_data -type f -name '*.json'
    cmds:
      - mkdir -p {{.SYNTHETIC_DIR}}
      - for: {var: CONFIGS}
        cmd: uv run --project ./scripts python ./scripts/synthetic-data.py {{.ITEM}} -o {{.SYNTHETIC_DIR}}

  clean:
    desc: Remove all build artifacts and generated data cache
    cmds:
      - rm -rf build/ .cache/

  build:tracy:capture:
    desc: >-
      Build tracy-capture from the fetched Tracy v0.11.1 sources,
      version-locked to the client library. Run before bench:kitti:tracy
      if tracy-capture is not already installed.
    vars:
      TRACY_DIR:   '{{.OUT_DIR}}/tracy'
      CAPTURE_DIR: '{{.OUT_DIR}}/tracy-capture'
    cmds:
      - >-
        cmake -S . -B {{.TRACY_DIR}} -G Ninja
        -DCMAKE_BUILD_TYPE=Release
        -DVDBSCAN_BUILD_CLI=OFF
        -DVDBSCAN_TRACY=ON
      - >-
        cmake -S {{.TRACY_DIR}}/_deps/tracy-src/capture
        -B {{.CAPTURE_DIR}} -G Ninja
        -DCMAKE_BUILD_TYPE=Release
      - cmake --build {{.CAPTURE_DIR}} -j
      - echo "tracy-capture built at {{.CAPTURE_DIR}}/tracy-capture"

  tracy:
    desc: >-
      Run tracy-capture (run this before bench:kitti:tracy).
      Arguments passed after -- will be interpreted as trace suffix.
      E.g. task tracy -- _eps=50_minpts=4 -> <sha>_eps=50_minpts=4.trace
    vars:
      ADDR: 127.0.0.1
      SHA:
        sh: git rev-parse --short=8 HEAD
      TRACE: ./build/{{.SHA}}
    deps: [build:tracy:capture]
    cmds:
      - '{{.OUT_DIR}}/tracy-capture/tracy-capture -a {{.ADDR}} -o {{.TRACE}}{{.CLI_ARGS}}.trace' 